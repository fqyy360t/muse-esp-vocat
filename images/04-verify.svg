<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="已经验证的五步与仍需人工验收的项目">
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="48" y="46" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">已经验过什么，还差什么</text>
  <text x="48" y="76" font-family="sans-serif" font-size="14" fill="#6b7280">左边五步都有可回看的证据；黄色虚线框里的事必须人拿着板子逐项试。</text>

  <g stroke="#d1d5db" stroke-width="1.6">
    <line x1="248" y1="206" x2="274" y2="206"/>
    <line x1="474" y1="206" x2="500" y2="206"/>
    <line x1="700" y1="206" x2="726" y2="206"/>
    <line x1="926" y1="206" x2="952" y2="206"/>
  </g>

  <g font-family="sans-serif">
    <rect x="48" y="126" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="64" y="154" font-size="12" font-weight="700" fill="#065f46">① 补丁</text>
    <text x="64" y="188" font-size="22" font-weight="700" fill="#065f46">19 / 19</text>
    <text x="64" y="216" font-size="11.5" fill="#374151">独立副本真实应用</text>
    <text x="64" y="236" font-size="11.5" fill="#374151">二次运行 0 改动</text>
    <text x="64" y="268" font-size="11" fill="#9ca3af">验证记录 §9</text>

    <rect x="274" y="126" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="290" y="154" font-size="12" font-weight="700" fill="#065f46">② 编译</text>
    <text x="290" y="188" font-size="22" font-weight="700" fill="#065f46">0 错误</text>
    <text x="290" y="216" font-size="11.5" fill="#374151">v6.0.3 全量 1m52s</text>
    <text x="290" y="236" font-size="11.5" fill="#374151">另一块板回归也通过</text>
    <text x="290" y="268" font-size="11" fill="#9ca3af">验证记录 §7</text>

    <rect x="500" y="126" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="516" y="154" font-size="12" font-weight="700" fill="#065f46">③ 烧录</text>
    <text x="516" y="188" font-size="22" font-weight="700" fill="#065f46">4 / 4</text>
    <text x="516" y="216" font-size="11.5" fill="#374151">COM27 实板一次通过</text>
    <text x="516" y="236" font-size="11.5" fill="#374151">四段校验全通过</text>
    <text x="516" y="268" font-size="11" fill="#9ca3af">验证记录 §8</text>

    <rect x="726" y="126" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="742" y="154" font-size="12" font-weight="700" fill="#065f46">④ 启动日志</text>
    <text x="742" y="188" font-size="22" font-weight="700" fill="#065f46">0 条错误</text>
    <text x="742" y="216" font-size="11.5" fill="#374151">4 份日志逐行扫</text>
    <text x="742" y="236" font-size="11.5" fill="#374151">无重启、无崩溃、无看门狗</text>
    <text x="742" y="268" font-size="11" fill="#9ca3af">验证记录 §8.5</text>

    <rect x="952" y="126" width="200" height="160" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="968" y="154" font-size="12" font-weight="700" fill="#065f46">⑤ 发布固件</text>
    <text x="968" y="188" font-size="22" font-weight="700" fill="#065f46">4 个资产</text>
    <text x="968" y="216" font-size="11.5" fill="#374151">回读哈希全匹配</text>
    <text x="968" y="236" font-size="11.5" fill="#374151">固件可直接烧</text>
    <text x="968" y="268" font-size="11" fill="#9ca3af">验证记录 §10</text>
  </g>

  <rect x="48" y="310" width="1104" height="108" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="6 4"/>
  <text x="72" y="338" font-family="sans-serif" font-size="14" font-weight="700" fill="#92400e">还差这些（要人动手 / 要交互）</text>
  <text x="72" y="364" font-family="sans-serif" font-size="12.5" fill="#374151">配网与配对 · 颜色反转 · 触摸对齐 · 外放可听 · 唤醒词 · 电量计读数 · BOOT 键 · V1.2 实物分支</text>
  <text x="72" y="390" font-family="sans-serif" font-size="12" fill="#92400e">结论：能启动、能亮屏、能录音、能扫 WiFi；不等于所有交互都验过。</text>
  <text x="72" y="408" font-family="sans-serif" font-size="11" fill="#9ca3af">每个数字的口径见 README 验证结果表；原始日志在发布页的调试包里（已脱敏）。</text>
</svg>
