<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="两条路：直接下载固件烧录，或自己准备 SDK 后编译">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="48" y="46" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">两条路，都能让喵伴跑起来</text>
  <text x="48" y="76" font-family="sans-serif" font-size="14" fill="#6b7280">不用先懂 ESP-IDF。想直接用就下载固件；想改代码就自己编译。两条路最后都落到同一块板。</text>

  <rect x="48" y="104" width="530" height="296" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="72" y="136" font-family="sans-serif" font-size="16" font-weight="700" fill="#065f46">路线 A · 不想编译（先试这个）</text>
  <text x="72" y="158" font-family="sans-serif" font-size="12" fill="#6b7280">约 3 分钟，只要一根 USB 线</text>
  <g font-family="sans-serif" font-size="13" fill="#065f46">
    <rect x="72" y="176" width="482" height="44" rx="8" fill="#ffffff" stroke="#d1fae5"/>
    <text x="88" y="203">① 打开 v0.1.0 发布页，下载固件压缩包</text>
    <rect x="72" y="230" width="482" height="44" rx="8" fill="#ffffff" stroke="#d1fae5"/>
    <text x="88" y="257">② 解压后核对校验和文件</text>
    <rect x="72" y="284" width="482" height="44" rx="8" fill="#ffffff" stroke="#d1fae5"/>
    <text x="88" y="311">③ 一条命令烧入 4 个文件</text>
    <rect x="72" y="338" width="482" height="44" rx="8" fill="#ffffff" stroke="#d1fae5"/>
    <text x="88" y="365">④ 复位，圆屏亮起 360×360 界面</text>
  </g>

  <rect x="622" y="104" width="530" height="296" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="646" y="136" font-family="sans-serif" font-size="16" font-weight="700" fill="#4c1d95">路线 B · 想改代码</text>
  <text x="646" y="158" font-family="sans-serif" font-size="12" fill="#6b7280">约 5 分钟准备 + 2 分钟编译，需要 ESP-IDF v6.0.3</text>
  <g font-family="sans-serif" font-size="13" fill="#4c1d95">
    <rect x="646" y="176" width="482" height="44" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="662" y="203">① 运行 setup.py：拉 SDK、打补丁</text>
    <rect x="646" y="230" width="482" height="44" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="662" y="257">② 进入准备好的 SDK 工程目录</text>
    <rect x="646" y="284" width="482" height="44" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="662" y="311">③ 一条命令编译出固件</text>
    <rect x="646" y="338" width="482" height="44" rx="8" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="662" y="365">④ 一条命令烧录到喵伴</text>
  </g>

  <rect x="48" y="420" width="1104" height="76" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="72" y="446" font-family="sans-serif" font-size="13" font-weight="700" fill="#111827">共同前提</text>
  <text x="72" y="470" font-family="sans-serif" font-size="12.5" fill="#374151">只适用于 ESP-VoCat 原板（Octal Flash / 16 MB Octal PSRAM）；烧录会覆盖原厂 xiaozhi 固件。</text>
  <text x="72" y="488" font-family="sans-serif" font-size="11.5" fill="#6b7280">本仓库只有 22 个文件（含 6 张图）、约 700 KB；SDK 源码由 setup.py 自动拉取，不入库。</text>
</svg>
